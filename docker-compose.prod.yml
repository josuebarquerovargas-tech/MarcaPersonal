# Producción: aplicación + PostgreSQL con volúmenes persistentes.
# Uso: docker compose -f docker-compose.prod.yml up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://ruben:${POSTGRES_PASSWORD:-cambia-esta-clave}@db:5432/ruben
      SESSION_SECRET: ${SESSION_SECRET:?Definí SESSION_SECRET con al menos 32 caracteres}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ruben
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia-esta-clave}
      POSTGRES_DB: ruben
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruben -d ruben"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  uploads:
